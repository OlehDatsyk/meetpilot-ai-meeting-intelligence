# Local stack: PostgreSQL, API, separate worker and the web app on http://localhost:8088 (WEB_PORT)
# Usage: docker compose up --build   (configure providers in .env first; see .env.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meetpilot
      POSTGRES_PASSWORD: meetpilot-local-only
      POSTGRES_DB: meetpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetpilot"]
      interval: 5s
      retries: 10

  api:
    build: { context: ./backend }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://meetpilot:meetpilot-local-only@db:5432/meetpilot
      STORAGE_ROOT: /data/storage
      LOCAL_WHISPER_MODEL_DIR: /app/models
      EMBEDDED_WORKER: "false"
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8088}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8088}
    volumes: [storage:/data]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ./backend }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://meetpilot:meetpilot-local-only@db:5432/meetpilot
      STORAGE_ROOT: /data/storage
      LOCAL_WHISPER_MODEL_DIR: /app/models
    command: ["python", "-m", "app.worker"]
    volumes: [storage:/data]  # shares recordings with the API
    depends_on: { api: { condition: service_healthy } }  # the API runs migrations first

  web:
    build: { context: ./frontend }
    ports: ["${WEB_PORT:-8088}:8080"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
